<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Operador</title>
    <link rel="stylesheet" href="../public/css/operador.css">
</head>
<body>
    <h1>Reportes</h1>

    <h2>Crear reporte</h2>
    <form>
        <label>Título <input type="text" name="titulo"></label>
        <label>Descripción <textarea name="descripcion"></textarea></label>
        <label>Prioridad
            <select name="prioridad">
                <option>Baja</option>
                <option>Media</option>
                <option>Alta</option>
            </select>
        </label>
        <button type="submit">Crear</button>
    </form>

    <h2>Buscar reportes</h2>
    <form>
        <input type="search" placeholder="Buscar">
        <select name="estado">
            <option>Todos los estados</option>
            <option>Abierto</option>
            <option>En proceso</option>
            <option>Cerrado</option>
        </select>
        <select name="prioridad">
            <option>Todas las prioridades</option>
            <option>Baja</option>
            <option>Media</option>
            <option>Alta</option>
        </select>
        <button type="submit">Filtrar</button>
    </form>

    <h2>Listado</h2>
    <ul>
        <li><a href="#detalle">Reporte de ejemplo</a> - Abierto - Alta</li>
    </ul>

    <h2 id="detalle">Detalle del reporte</h2>
    <p><strong>Título:</strong> Reporte de ejemplo</p>
    <p><strong>Estado:</strong> Abierto</p>

    <form>
        <label>Descripción <textarea name="descripcion">Descripción del reporte</textarea></label>
        <label>Prioridad
            <select name="prioridad">
                <option>Baja</option>
                <option>Media</option>
                <option selected>Alta</option>
            </select>
        </label>
        <button type="submit">Guardar cambios</button>
    </form>
</body>
</html>
