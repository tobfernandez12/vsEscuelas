<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Usuario</title>
    <link rel="stylesheet" href="../static/css/usuario.css">
</head>
<body>
    <h1>Reportes</h1>

    <h2>Crear reporte</h2>
    <form id="crear-reporte">
        <label>Título <input type="text" name="titulo" required></label>
        <label>Descripción <textarea name="descripcion" required></textarea></label>
        <label>Prioridad
            <select name="prioridad">
                <option value="Baja">Baja</option>
                <option value="Media">Media</option>
                <option value="Alta">Alta</option>
            </select>
        </label>
        <button type="submit">Crear</button>
    </form>

    <h2>Buscar reportes</h2>
    <form id="filtro-reportes">
        <input type="search" name="busqueda" placeholder="Buscar">
        <select name="estado">
            <option value="">Todos los estados</option>
            <option value="Abierto">Abierto</option>
            <option value="En proceso">En proceso</option>
            <option value="Cerrado">Cerrado</option>
        </select>
        <select name="prioridad">
            <option value="">Todas las prioridades</option>
            <option value="Baja">Baja</option>
            <option value="Media">Media</option>
            <option value="Alta">Alta</option>
        </select>
        <button type="submit">Filtrar</button>
    </form>

    <h2>Listado</h2>
    <ul id="lista-reportes"></ul>

    <h2 id="detalle">Detalle del reporte</h2>
    <p><strong>Título:</strong> <span id="detalle-titulo">Seleccioná un reporte</span></p>
    <p><strong>Descripción:</strong> <span id="detalle-descripcion">-</span></p>
    <p><strong>Estado:</strong> <span id="detalle-estado">-</span></p>

    <form id="editar-reporte">
        <label>Descripción <textarea name="descripcion" required disabled></textarea></label>
        <label>Prioridad
            <select name="prioridad">
                <option value="Baja">Baja</option>
                <option value="Media">Media</option>
                <option value="Alta">Alta</option>
            </select>
        </label>
        <button type="submit" disabled>Guardar cambios</button>
    </form>
    <script src="../static/js/usuario.js"></script>
</body>
</html>
