<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de reportes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='/css/administrador.css')}}">
</head>
<body>

    <div>
        <h1>Administración de reportes</h1>
        <form action="{{ url_for('logout') }}" method="POST">
            <button type="submit">Cerrar sesión</button>
        </form>
    </div>
    
    <h2>Crear reporte</h2>
    <form id="crear-reporte">
        <label>Título <input type="text" name="titulo" required></label>
        <label>Descripción <textarea name="descripcion" required></textarea></label>
        <label>Prioridad
            <select name="prioridad">
                <option value="Baja">Baja</option>
                <option value="Media">Media</option>
                <option value="Alta">Alta</option>
            </select>
        </label>
        <button type="submit">Crear reporte</button>
    </form>

    <h2>Buscar reportes</h2>
    <form id="filtro-reportes" class="filtros">
        <input type="search" name="busqueda" placeholder="Buscar reporte">
        <select name="estado">
            <option value="">Todos los estados</option>
            <option value="Abierto">Abierto</option>
            <option value="En proceso">En proceso</option>
            <option value="Cerrado">Cerrado</option>
        </select>
        <button type="submit">Filtrar</button>
    </form>

    <h2>Listado</h2>
    <ul id="lista-reportes"></ul>

    <h2 id="detalle">Detalle del reporte</h2>
    <p><strong>Título:</strong> <span id="detalle-titulo">Seleccioná un reporte</span></p>
    <p><strong>Descripción:</strong> <span id="detalle-descripcion">-</span></p>
    <p><strong>Prioridad:</strong> <span id="detalle-prioridad">-</span></p>
    <p><strong>Estado:</strong> <span id="detalle-estado">-</span></p>

    <form id="editar-reporte">
        <label>Cambiar estado
            <select name="estado">
                <option value="Abierto">Abierto</option>
                <option value="En proceso">En proceso</option>
                <option value="Cerrado">Cerrado</option>
            </select>
        </label>
        <label>Solución
            <textarea name="solucion" placeholder="Escribir solución"></textarea>
        </label>
        <button type="submit" disabled>Guardar cambios</button>
    </form>

    <form id="eliminar-reporte" class="eliminar">
        <button type="submit" disabled>Eliminar reporte abierto</button>
    </form>
    <script src="{{ url_for('static', filename='js/administrador.js') }}"></script>
</body>
</html>
