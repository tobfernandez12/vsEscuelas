<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="../static/css/login.css">
    <link rel="icon" href="../static/images/logo.png" type="image/png">
</head>

<body class="login-body">
    <main class="login-contenedor">
        <div class="login-icono">✦</div>

        <h1>Mesa de Ayuda</h1>
        <p class="login-subtitulo">Centro de Formación Horizonte</p>

        <!-- {% if error %} -->
        <p id="error-login" role="alert">{{ error }}</p>
        <!-- {% endif %} -->

        <form method="POST" action="{{ url_for('login') }}">

            <div class="campo">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ingrese su usuario" required>
            </div>

            <div class="campo">

                <label for="clave">Contraseña</label>

                <div class="campo-password">
                    <input type="password" id="clave" name="clave" placeholder="Ingrese su contraseña" required>
                    <button type="button" id="mostrarClave" class="boton-ojo">Ver</button>
                </div>

            </div>
            <button type="submit" class="boton-login">Iniciar sesión</button>

        </form>

        <p class="login-pie">Sistema de gestión de incidencias técnicas</p>

    </main>
    <script src="../static/js/login.js"></script>
</body>
</html>
